[project]
name = "ntc-vss-retail-poc"
version = "0.1.0"
description = "One-store, ten-camera NVIDIA VSS retail proof of concept"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pyyaml>=6.0,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
