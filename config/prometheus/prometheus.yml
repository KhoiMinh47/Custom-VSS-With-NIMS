global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    project: ntc-vss-retail-poc
    store: poc-store-01

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: phase07-rtcv
    metrics_path: /metrics
    static_configs:
      - targets: ["rtcv-metadata:8080"]

  - job_name: phase09-behavior-analytics
    metrics_path: /metrics
    static_configs:
      - targets: ["behavior-analytics:8080"]

  - job_name: phase10-incidents
    metrics_path: /metrics
    static_configs:
      - targets: ["incidents:8080"]

  - job_name: phase10-alert-verification
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-verification:8080"]

  - job_name: phase11-rt-vlm-results
    metrics_path: /metrics
    static_configs:
      - targets: ["rt-vlm-results:8080"]

  - job_name: phase12-search
    metrics_path: /metrics
    static_configs:
      - targets: ["search:8080"]

  - job_name: phase13-summarization
    metrics_path: /metrics
    static_configs:
      - targets: ["summarization:8080"]

  # PENDING GATE: phase15-api now runs on host networking bound to
  # 127.0.0.1:39510, so this legacy bridge target is unreachable by design.
  # Do not "fix" it by binding Phase 15 to 0.0.0.0. The proposed replacement
  # (not approved, not implemented) is the Unix-socket metrics relay in
  # docs/decisions/ADR-008-phase15-metrics-relay.md.
  - job_name: phase15-unified-api
    metrics_path: /metrics
    static_configs:
      - targets: ["phase15-api:8080"]
