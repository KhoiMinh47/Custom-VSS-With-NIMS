server {
    listen 443 ssl;
    server_name vss-retail.internal;

    ssl_certificate /run/secrets/tls/server.crt;
    ssl_certificate_key /run/secrets/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://phase15-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;
        proxy_hide_header Server;
    }
}
